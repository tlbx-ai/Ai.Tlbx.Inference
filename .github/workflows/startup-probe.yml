name: Actions startup probe

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in Directory.Build.props
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $version -ne $env:RELEASE_VERSION) {
            throw 'Requested version must match Directory.Build.props exactly.'
          }
      - name: Resolve NuGet action without token exchange
        if: inputs.version == 'resolve-action-only'
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e
        with:
          user: Ai.Tlbx
      - name: Confirm complete publishing envelope
        run: Write-Host "Validated ${{ inputs.version }} from ${{ github.sha }} without publication"
