name: Actions startup probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  runner:
    environment: nuget
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Confirm runner startup
        run: echo "Runner started with OIDC permission and nuget environment"
